<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover：让页面铺到刘海/圆角区域，配合 CSS 里的 safe-area 留白
         interactive-widget=resizes-content：安卓上软键盘弹出时收缩内容区，而不是平移整个页面
         （不写这条时，聚焦输入框会让浏览器把页面往下推，表现为"页面能上下滚动"） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>聊天室</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
