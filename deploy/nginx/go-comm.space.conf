# go-comm.space 的站点配置（云主机上的 nginx 容器）
#
# 只做两件事：终止 TLS、把请求原样转给 Colyseus 容器（chat-server:2567）。
# 前端页面、matchmaking、WebSocket 全部由那一个容器提供，所以这里是"整站反代"，
# 不需要区分静态文件和 ws 路径（Colyseus 的 ws 和 matchmaking 都在根路径上）。

# 有 Upgrade 头（WebSocket 握手）就转发 upgrade，普通请求用 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP 80：跳 HTTPS，保留证书续期的验证目录
server {
    listen 80;
    server_name go-comm.space;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：整站转给 Colyseus
server {
    listen 443 ssl;
    server_name go-comm.space;

    ssl_certificate     /etc/letsencrypt/live/go-comm.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go-comm.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://chat-server:2567;
        proxy_http_version 1.1;

        # WebSocket 握手
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 聊天室是长连接，别让 nginx 在空闲 60 秒后把连接掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
